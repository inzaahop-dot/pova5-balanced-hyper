name: Android Debug Build

      - name: Codex Action
        uses: icoretech/codex-action@v0.9.64
        with:
          prompt: |
            Read the project files before making changes.
            Work on the Balanced Hyper Android application.
            Fix bugs and implement useful app-level features.
            Preserve the existing project architecture.
            Do not modify boot, partitions, kernel, root configuration,
            device security settings or thermal protections.
            Do not install anything on a phone.
            Run appropriate checks and summarize all changed files.
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          timeout: "900"

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: balanced-hyper-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
